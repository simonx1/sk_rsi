[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-rsi"
version = "0.1.0"
description = "Recursive self-improvement loops with Self-Improvement Memory, for any project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
